<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Agenda de contactos del proyecto Green Campus. Consulta, añade y borra contactos en tu navegador.">
    <meta name="author" content="e-ghost 2019">

    <title>AgendaVue</title>

    <!-- Bootstrap Core CSS - Uses Bootswatch Flatly Theme: http://bootswatch.com/flatly/ -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="css/freelancer.css" rel="stylesheet">

    <!-- Custom Fonts -->
    <link href="font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css">

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "@id": "https://agendavue.netlify.app/#aplicacion",
  "name": "AgendaVue",
  "url": "https://agendavue.netlify.app/",
  "description": "Agenda de contactos del proyecto Green Campus del grupo IW-BI-08. Permite consultar, añadir y borrar contactos en el navegador.",
  "applicationCategory": "ProductivityApplication",
  "operatingSystem": "Any",
  "browserRequirements": "Requiere JavaScript. La conservación de contactos requiere almacenamiento local disponible.",
  "inLanguage": "es",
  "isAccessibleForFree": true,
  "featureList": [
    "Consultar contactos",
    "Añadir contactos",
    "Borrar contactos",
    "Guardar contactos en el navegador"
  ]
}
    </script>
</head>

<body id="page-top" class="index">

    <div id="app"></div>
    <noscript><p>Activa JavaScript para utilizar la agenda de contactos.</p></noscript>

    <!-- Plantilla compilada por Vue, no HTML estático del documento. -->
    <script type="text/x-template" id="agenda-template">
<div id="app">
        <!-- Navigation -->
        <nav class="navbar navbar-default navbar-fixed-top">
            <div class="container">
                <!-- Brand and toggle get grouped for better mobile display -->
                <div class="navbar-header page-scroll">
                    <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1">
                        <span class="sr-only">Cambiar navegación</span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                    <a class="navbar-brand" href="#page-top">AgendaVue</a>
                </div>

                <!-- Collect the nav links, forms, and other content for toggling -->
                <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
                    <ul class="nav navbar-nav navbar-right">
                        <li class="hidden">
                            <a href="#page-top"></a>
                        </li>
                        <li class="page-scroll">
                            <a href="#contactos">Contactos</a>
                        </li>
                        <li class="page-scroll">
                            <a href="#nuevo">Añadir contacto</a>
                        </li>
                        <li class="page-scroll">
                            <a href="#about">Acerca de...</a>
                        </li>
                    </ul>
                </div>
                <!-- /.navbar-collapse -->
            </div>
            <!-- /.container-fluid -->
        </nav>

        <!-- Header -->
        <header>
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="intro-text">
                            <h1 class="name">AgendaVue</h1>
                            <hr class="star-light">
                            <span class="skills">Agenda básica en Vue</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main>
        <!-- Contactos Grid Section -->
        <section id="contactos">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12 text-center">
                        <h2>Contactos</h2>
                        <hr class="star-primary">
                    </div>
                </div>
                <div v-if="contactos.length > 0">
                    <div class="row">
                        <div class="col-xs-4">
                            <p class="cabecera-contactos"><strong>Nombre</strong></p>
                        </div>
                        <div class="col-xs-4">
                            <p class="cabecera-contactos"><strong>Email</strong></p>
                        </div>
                        <div class="col-xs-3">
                            <p class="cabecera-contactos"><strong>Teléfono</strong></p>
                        </div>
                    </div>
                    <div class="row" v-for="(contacto, index) in contactos" :key="index" itemscope itemtype="https://schema.org/Person" vocab="https://schema.org/" typeof="Person">
                        <div class="col-xs-4">
                            <p itemprop="name" property="name">{{ contacto.nombre }}</p>
                        </div>
                        <div class="col-xs-4">
                            <p itemprop="email" property="email">{{ contacto.email }}</p>
                        </div>
                        <div class="col-xs-3">
                            <p itemprop="telephone" property="telephone">{{ contacto.telefono }}</p>
                        </div>
                        <div class="col-xs-1">
                            <button type="button" class="btn btn-danger btn-sm" @click="borrarContacto(index)" :aria-label="'Borrar contacto de ' + contacto.nombre" title="Borrar contacto">
                                <span class="glyphicon glyphicon-remove" aria-hidden="true"></span>
                            </button>
                        </div>
                    </div>
                </div>
                <div v-else>
                    <div class="row">
                        <div class="col-xs-12">
                            <p>No se ha encontrado ningún contacto.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Añadir nuevo Section -->
        <section id="nuevo">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12 text-center">
                        <h2>Añadir contacto</h2>
                        <hr class="star-primary">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-8 col-lg-offset-2">
                        <form name="sentMessage" id="contactForm" @submit.prevent="anadirContacto">
                            <div class="row control-group">
                                <div class="form-group col-xs-12 floating-label-form-group controls">
                                    <label for="name">Nombre</label>
                                    <input type="text" class="form-control" placeholder="Nombre" id="name" v-model.trim="nuevoContacto.nombre" required>
                                    <p class="help-block text-danger"></p>
                                </div>
                            </div>
                            <div class="row control-group">
                                <div class="form-group col-xs-12 floating-label-form-group controls">
                                    <label for="email">Email</label>
                                    <input type="email" class="form-control" placeholder="Email" id="email" v-model.trim="nuevoContacto.email" required>
                                    <p class="help-block text-danger"></p>
                                </div>
                            </div>
                            <div class="row control-group">
                                <div class="form-group col-xs-12 floating-label-form-group controls">
                                    <label for="phone">Teléfono</label>
                                    <input type="tel" class="form-control" placeholder="Número de teléfono" id="phone" v-model.trim="nuevoContacto.telefono" required>
                                    <p class="help-block text-danger"></p>
                                </div>
                            </div>
                            <br>
                            <div id="success">
                                <div v-if="mensajeError" class="alert alert-danger" role="alert">{{ mensajeError }}</div>
                            </div>
                            <div class="row">
                                <div class="form-group col-xs-12">
                                    <button type="submit" class="btn btn-success btn-lg">Añadir</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- About Section -->
        <section class="success" id="about">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12 text-center">
                        <h2>Acerca de...</h2>
                        <hr class="star-light">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12 text-center">
                        <div itemscope itemtype="https://schema.org/WebApplication" vocab="https://schema.org/" typeof="WebApplication">
                            <p><span itemprop="name" property="name">AgendaVue</span> es una agenda de contactos desarrollada con Vue para el proyecto Green Campus del grupo IW-BI-08.</p>
                            <p itemprop="description" property="description">Permite consultar, añadir y borrar contactos. Los datos se guardan en este navegador y no se sincronizan entre dispositivos.</p>
                            <p>Compartir la aplicación:</p>
                            <p>
                                <a class="btn btn-default" href="https://twitter.com/intent/tweet?text=AgendaVue%20del%20proyecto%20Green%20Campus&amp;url=https%3A%2F%2Fagendavue.netlify.app%2F" target="_blank" rel="noopener noreferrer">Compartir en X</a>
                                <a class="btn btn-default" href="https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Fagendavue.netlify.app%2F" target="_blank" rel="noopener noreferrer">Compartir en Facebook</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        </main>

        <!-- Footer -->
        <footer class="text-center">
            <div class="footer-above">
                <div class="container">
                </div>
            </div>
            <div class="footer-below">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-12">
                            Copyleft &copy; e-ghost 2019
                        </div>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Scroll to Top Button (Only visible on small and extra-small screen sizes) -->
        <div class="scroll-top page-scroll visible-xs visible-sm">
            <a class="btn btn-primary" href="#page-top" aria-label="Volver arriba">
                <i class="fa fa-chevron-up"></i>
            </a>
        </div>
    </div>
    </script>

    <!-- Vue monta la página antes de iniciar los efectos del tema. -->
    <script src="js/vue.js"></script>
    <script src="js/agenda.js"></script>

    <!-- jQuery -->
    <script src="js/jquery.js"></script>

    <!-- Bootstrap Core JavaScript -->
    <script src="js/bootstrap.min.js"></script>

    <!-- Plugin JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.3/jquery.easing.min.js"></script>
    <script src="js/classie.js"></script>
    <script src="js/cbpAnimatedHeader.js"></script>

    <!-- Custom Theme JavaScript -->
    <script src="js/freelancer.js"></script>



</body>

</html>
